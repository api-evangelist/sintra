description: >-
  Sintra's published subscription plans, read from the public pricing page. Sintra
  is a seat-and-credit consumer/SMB SaaS, not a developer platform: plans buy access
  to the AI "helpers" in the web and mobile apps and a monthly pool of workspace
  credits. No plan includes API access, an API key, or a developer tier, because
  Sintra publishes no public API.
