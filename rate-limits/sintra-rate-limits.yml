metering:
  model: prepaid monthly credit pool
  scope: per-workspace
  window: billing cycle (monthly, anchored to subscription start date/time)
  rollover: false
  reset: Credits reset at the start of each billing cycle.
  free_credits_on_new_workspace: 20
  daily_or_hourly_caps: none published
  consumption:
  - action: Message sent in chat to a Helper
    credits: 0.1 - 1
  - action: Image created in chat
    credits: 0.5 - 1.8
  - action: Social media post created in chat
    credits: 1
  - action: Running a scheduled task (Basic)
    credits: 1 - 5
    note: Varies with how in-depth the task is.
  included_by_plan: See plans/sintra-plans-pricing.yml — 250 credits/month on every
    published Sintra X tier.
