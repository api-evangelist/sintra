description: >-
  Sintra publishes NO API rate limits, because Sintra publishes no public API — its
  own help center states plainly that Sintra does not provide a public API
  (https://help.sintra.ai/en/articles/12929400-integrations-explained). There are
  therefore no documented request windows, no burst allowances, no X-RateLimit-*
  or RateLimit-* response headers, and no documented 429 behaviour for third-party
  callers. What Sintra does meter is in-product consumption, through a monthly
  workspace credit pool. Those consumption rates are recorded below as the real
  throttle a Sintra user encounters, but they are a billing quota, not an HTTP
  rate limit, and no agent or integrator can observe them over the wire.
limit_count: 0
limit_note: >-
