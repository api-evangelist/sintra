aid: sintra
name: Sintra
description: >-
  Sintra is a no-code AI-employees platform that gives small businesses a team of
  role-based digital workers. It ships 12 specialized AI helpers — such as Soshie
  (social media), Cassie (customer support), Seomi (SEO), Buddy, and Vizzy (meeting
  notetaker) — that handle social media, inbox, content, customer support, SEO, and
  sales and business operations. Users chat with helpers, schedule recurring
  background tasks, build custom helpers with the Helper Builder, and connect tools
  like Facebook, Instagram, Gmail, Google Calendar, Outlook, Google Drive, Notion,
  and Strava through consumer OAuth integrations. Sintra is a portfolio company of
  Earlybird Venture Capital. As of this profile Sintra publishes no public developer
  API, OpenAPI, or API reference — it is an end-user low-code product rather than a
  developer platform.
