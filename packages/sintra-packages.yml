description: >-
  Sintra publishes no client SDK in any language, because Sintra publishes no
  public API to wrap. The registries were searched and the results are recorded
  below as honest negatives. One first-party published package DOES exist — the
  Webflow front-end asset bundle Sintra's own marketing site loads from jsDelivr,
  pinned at a specific tag — and it is recorded because it is genuinely
  first-party and genuinely versioned, but it is website presentation code, not
  an API client. No `SDKs` pointer is wired in apis.yml for that reason.
