  ownership_evidence: >-
    Loaded by <link href="https://cdn.jsdelivr.net/gh/sintra-ai/wf-snt-ai@v0.0.3/..."> in
    the HTML of https://sintra.ai, from the sintra-ai GitHub org whose profile name is
    "sintra" and description "we help small businesses grow". The site loading its own
    stylesheet from that org is what establishes the org as Sintra's.
  note: >-
    Styling/behaviour bundle for the Sintra Webflow marketing site ("wf" = Webflow).
    Distributed via the jsDelivr GitHub endpoint rather than a package registry, so
    there is no npm/PyPI metadata endpoint; the version is read from the pinned tag in
    the URL itself and the date from the matching GitHub release. jsDelivr reports tags
    v0.0.0 through v0.0.3; the site pins v0.0.3. Repo last pushed 2026-07-31, i.e. the
    default branch has moved since the last tagged release. Not a consumable client
    library — no API to call.
