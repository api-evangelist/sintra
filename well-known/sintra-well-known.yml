description: >-
  Results of probing the /.well-known/ discovery surface for every Sintra host.
  Sintra publishes no public developer API, and no Sintra-controlled host serves
  any /.well-known/ document: every path on sintra.ai and api.sintra.ai returned
  404. The single 200 in this probe — /.well-known/security.txt on
  help.sintra.ai — is NOT Sintra's document. help.sintra.ai is a CNAME to
  us.intercomhelpcenter.com and the file self-identifies as Intercom's, naming
  Intercom's Bugcrowd program, security@intercom.com and
  Canonical: https://app.intercom.com/.well-known/security.txt. It is served by
  the help-desk vendor to every customer subdomain and says nothing about
  Sintra's own security posture, so it is recorded here as a vendor artifact and
  is deliberately NOT wired as a SecurityTxt, Security or VulnerabilityDisclosure
  pointer in apis.yml. For the same reason no WellKnown pointer is emitted: no
  Sintra-controlled path returned a real document.
pointer_emitted: false
pointer_note: >-
  No common[].type WellKnown / SecurityTxt pointer is wired. Zero Sintra-owned
  paths returned a document; the only 200 belongs to Intercom.
